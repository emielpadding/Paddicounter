<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="theme-color" content="#1a1a2e">
<title>Paddicounter - Dart score</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#22223a;--surface3:#2a2a45;
  --green:#00c87a;--green-dim:#0f6e4a;--green-bg:#0a2a1e;
  --red:#ff4757;--red-bg:#2a0f14;
  --orange:#ff8c42;--orange-bg:#2a1a0a;
  --blue:#4ecdc4;--blue-bg:#0a2228;
  --gold:#ffd700;
  --text:#f0f0f0;--text2:#9090b0;--text3:#5a5a7a;
  --border:#2a2a45;--border2:#3a3a5a;
  --radius:10px;--radius-lg:14px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
.container{padding:1rem;padding-bottom:3rem;max-width:700px;margin:0 auto;}

/* HEADER */
.header{text-align:center;margin-bottom:1.5rem;padding-top:0.5rem;}
.header h1{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--green);letter-spacing:2px;}
.header p{font-size:13px;color:var(--text2);margin-top:2px;}

/* MODE TABS */
.mode-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem;}
.mode-tab{padding:0.5rem 0.2rem;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;text-align:center;color:var(--text2);touch-action:manipulation;transition:all 0.15s;letter-spacing:0.5px;}
.mode-tab.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;margin-bottom:0.75rem;}
.card-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;}

/* SETUP */
.setup-label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;margin-top:12px;}
.setup-label:first-child{margin-top:0;}
.setup-input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:16px;background:var(--surface2);color:var(--text);}
.setup-input:focus{outline:none;border-color:var(--green);}
.player-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.player-input-group .setup-label{font-size:12px;}
.add-player-btn{width:100%;margin-top:10px;font-size:13px;color:var(--text2);padding:10px;background:none;border:1px dashed var(--border2);border-radius:8px;cursor:pointer;touch-action:manipulation;}
.remove-btn{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;margin-left:6px;}
.start-btn{width:100%;background:var(--green);color:#000;border:none;padding:0.9rem;font-size:17px;font-weight:700;border-radius:12px;cursor:pointer;margin-top:14px;touch-action:manipulation;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
.start-btn:active{opacity:0.85;}

/* OPPONENT SELECTOR */
.opponent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0.5rem;}
.opp-btn{padding:0.8rem;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;text-align:left;touch-action:manipulation;transition:all 0.15s;}
.opp-btn.active{border-color:var(--green);background:var(--green-bg);}
.opp-btn .opp-name{font-size:14px;font-weight:700;font-family:'Rajdhani',sans-serif;color:var(--text);letter-spacing:0.5px;}
.opp-btn .opp-desc{font-size:11px;color:var(--text2);margin-top:2px;}
.opp-btn.active .opp-name{color:var(--green);}
.solo-btn{width:100%;padding:0.75rem;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;text-align:center;touch-action:manipulation;font-size:14px;font-weight:600;color:var(--text2);margin-bottom:8px;}
.solo-btn.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}

/* PLAYER CARDS */
.players-grid{display:grid;gap:8px;margin-bottom:0.75rem;}
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.85rem 1rem;position:relative;transition:border-color 0.2s;}
.player-card.active{border:2px solid var(--green);background:var(--green-bg);}
.player-card.bot-card{border-color:var(--orange);}
.player-card.bot-card.active{border:2px solid var(--orange);background:var(--orange-bg);}
.player-card.eliminated{opacity:0.35;}
.player-card.killer-status{border:2px solid var(--red);}
.player-top{display:flex;justify-content:space-between;align-items:flex-start;}
.player-name-row{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.player-name{font-size:13px;color:var(--text2);font-weight:500;}
.player-score{font-family:'Rajdhani',sans-serif;font-size:38px;font-weight:700;color:var(--text);line-height:1;}
.player-stats-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
.stat-chip{font-size:11px;color:var(--text3);}
.stat-chip b{color:var(--text2);font-weight:600;}
.badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:700;letter-spacing:0.3px;}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-dim);}
.badge-orange{background:var(--orange-bg);color:var(--orange);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-gray{background:var(--surface3);color:var(--text3);}
.dots-row{display:flex;gap:4px;margin-top:5px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border2);}
.dot.filled{background:var(--green);}

/* CHECKOUT BOX */
.checkout-darts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.checkout-dart{display:inline-block;background:var(--green-bg);color:var(--green);border:1px solid var(--green-dim);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700;font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;}

/* INPUT AREA */
.input-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.75rem;}
.input-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.score-input{flex:1;font-size:28px;text-align:center;padding:0.5rem;font-weight:700;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);font-family:'Rajdhani',sans-serif;}
.score-input:focus{outline:none;border-color:var(--green);}
.throw-btn{font-size:14px;padding:0.6rem 0.9rem;font-weight:700;background:var(--green);color:#000;border:none;border-radius:8px;cursor:pointer;touch-action:manipulation;white-space:nowrap;font-family:'Rajdhani',sans-serif;}
.throw-btn:active{opacity:0.8;}
.undo-btn{font-size:13px;padding:0.6rem 0.8rem;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;touch-action:manipulation;white-space:nowrap;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.num-btn{padding:0.75rem;font-size:20px;font-weight:700;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;touch-action:manipulation;user-select:none;color:var(--text);font-family:'Rajdhani',sans-serif;}
.num-btn:active{background:var(--surface3);transform:scale(0.94);}
.num-btn.ok{background:var(--green);color:#000;border-color:var(--green);}
.num-btn.clr{color:var(--red);}

/* BOT TURN */
.bot-thinking{background:var(--orange-bg);border:1px solid var(--orange);border-radius:var(--radius-lg);padding:1rem;margin-bottom:0.75rem;text-align:center;}
.bot-thinking p{font-size:13px;color:var(--orange);margin-bottom:0.5rem;}
.bot-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;animation:botpulse 0.8s ease-in-out infinite;}
@keyframes botpulse{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);}}
.bot-throw-btn{background:var(--orange);color:#000;border:none;padding:0.7rem 1.5rem;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation;font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;}
.bot-throw-btn:active{opacity:0.8;}
.bot-result-log{margin-top:0.75rem;}
.bot-dart-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--text2);}
.bot-dart-row .dart-result{font-weight:700;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;}
.bot-dart-row .dart-bust{color:var(--red);}
.bot-dart-row .dart-win{color:var(--green);}

/* TIPS */
.tips-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.85rem 1rem;margin-bottom:0.75rem;}
.tip-icon{color:var(--blue);margin-right:4px;}

/* HISTORY */
.history-box{background:var(--surface2);border-radius:var(--radius-lg);padding:0.85rem 1rem;margin-bottom:0.75rem;}
.history-item{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border);}
.history-item:last-child{border-bottom:none;}
.history-item .h-player{font-weight:600;color:var(--text);}
.history-item .h-bust{color:var(--red);}
.history-item .h-win{color:var(--green);}

/* STATS */
.stats-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.85rem 1rem;margin-bottom:0.75rem;}
.stat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.stat-pill{background:var(--surface2);border-radius:4px;padding:4px 9px;font-size:11px;color:var(--text3);}
.stat-pill b{color:var(--text);font-weight:600;}

/* WINNER */
.winner-banner{background:linear-gradient(135deg,var(--green-bg),var(--surface));border:1px solid var(--green);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;margin-bottom:1rem;}
.winner-banner h2{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--green);letter-spacing:1px;}
.winner-banner p{font-size:13px;color:var(--text2);margin-top:4px;}

/* KILLER */
.phase-banner{border-radius:8px;padding:0.7rem 1rem;margin-bottom:0.75rem;font-size:13px;font-weight:600;}
.phase-fill{background:var(--green-bg);color:var(--green);border:1px solid var(--green-dim);}
.phase-attack{background:var(--red-bg);color:var(--red);border:1px solid var(--red);}
.killer-setup-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;margin-bottom:0.75rem;}
.killer-assign-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.killer-assign-row:last-child{border-bottom:none;}
.killer-assign-num{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--green);min-width:36px;text-align:center;}
.killer-num-input{width:70px;font-size:20px;text-align:center;padding:8px;border:1px solid var(--border2);border-radius:8px;background:var(--surface2);color:var(--text);}
.killer-assign-btn{font-size:13px;padding:8px 14px;background:var(--green);color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:700;touch-action:manipulation;}
.life{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block;margin-right:3px;}
.life.lost{background:var(--border2);}
.killer-score-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0.75rem;}
.kscore-btn{padding:0.8rem 0.4rem;font-size:14px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;cursor:pointer;text-align:center;font-weight:700;touch-action:manipulation;color:var(--text);font-family:'Rajdhani',sans-serif;}
.kscore-btn:active{transform:scale(0.95);}
.kscore-btn.ks{border-color:#0f6e4a;}
.kscore-btn.kd{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.kscore-btn.kt{border-color:#00c87a;background:#0a3a25;color:var(--green);}
.kscore-btn.kmiss{color:var(--text3);font-weight:500;font-family:'Inter',sans-serif;font-size:13px;}
.section-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;margin-top:0.75rem;text-transform:uppercase;letter-spacing:0.05em;}
.target-select{display:grid;gap:8px;margin-bottom:0.5rem;}
.target-btn{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;cursor:pointer;font-size:14px;touch-action:manipulation;color:var(--text);}
.target-btn:active{background:var(--red-bg);}
.target-btn.selected{background:var(--red-bg);border:2px solid var(--red);}
.target-btn .t-name{font-weight:700;}
.target-btn .t-lives{color:var(--red);font-size:13px;}

/* NEW GAME */
.new-game-btn{width:100%;padding:0.8rem;font-size:14px;margin-top:0.5rem;border-radius:10px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;touch-action:manipulation;}
.new-game-btn:active{background:var(--surface2);}

/* ANIMATIONS */
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card,.player-card,.checkout-box,.input-area,.tips-box,.history-box,.stats-box{animation:slideIn 0.2s ease;}
</style>
</head>
<body>
<div class="container">
  <div class="header" onclick="headerClick()" style="cursor:pointer">
    <h1>🎯 DARTS</h1><p>Scorer · Checkout · Bot</p>
  </div>
  <div id="app"></div>
</div>
<script>
// ─── CHECKOUT TABLE ───────────────────────────────────────────────────────────
const CHECKOUTS={
  170:"T20 T20 Bull",167:"T20 T19 Bull",164:"T20 T18 Bull",161:"T20 T17 Bull",
  160:"T20 T20 D20",158:"T20 T20 D19",157:"T20 T19 D20",156:"T20 T20 D18",
  155:"T20 T19 D19",154:"T20 T18 D20",153:"T20 T19 D18",152:"T20 T20 D16",
  151:"T20 T17 D20",150:"T20 T18 D18",149:"T20 T19 D16",148:"T20 T20 D14",
  147:"T20 T17 D18",146:"T20 T18 D16",145:"T20 T19 D14",144:"T20 T20 D12",
  143:"T20 T17 D16",142:"T20 T14 D20",141:"T20 T19 D12",140:"T20 T16 D16",
  139:"T20 T13 D20",138:"T20 T18 D12",137:"T20 T15 D16",136:"T20 T20 D8",
  135:"T20 T17 D12",134:"T20 T14 D16",133:"T20 T19 D8",132:"T20 T16 D12",
  131:"T20 T13 D16",130:"T20 T18 D8",129:"T19 T16 D12",128:"T20 T12 D16",
  127:"T20 T17 D8",126:"T20 T11 D16",125:"T20 T15 D10",124:"T20 T14 D11",
  123:"T19 T16 D9",122:"T18 T16 D10",121:"T20 T11 D14",120:"T20 S20 D20",
  119:"T19 T12 D13",118:"T20 S18 D20",117:"T20 S17 D20",116:"T20 S16 D20",
  115:"T20 S15 D20",114:"T20 S14 D20",113:"T20 S13 D20",112:"T20 S12 D20",
  111:"T20 S11 D20",110:"T20 S10 D20",109:"T20 S9 D20",108:"T20 S8 D20",
  107:"T19 S10 D20",106:"T20 S6 D20",105:"T20 S5 D20",104:"T20 S4 D20",
  103:"T20 S3 D20",102:"T20 S2 D20",101:"T20 S1 D20",100:"T20 D20",
  99:"T19 S10 D16",98:"T20 D19",97:"T19 D20",96:"T20 D18",95:"T19 D19",
  94:"T18 D20",93:"T19 D18",92:"T20 D16",91:"T17 D20",90:"T18 D18",
  89:"T19 D16",88:"T16 D20",87:"T17 D18",86:"T18 D16",85:"T15 D20",
  84:"T20 D12",83:"T17 D16",82:"T14 D20",81:"T19 D12",80:"T16 D16",
  79:"T13 D20",78:"T18 D12",77:"T19 D10",76:"T20 D8",75:"T17 D12",
  74:"T14 D16",73:"T19 D8",72:"T16 D12",71:"T13 D16",70:"T18 D8",
  69:"T19 D6",68:"T20 D4",67:"T17 D8",66:"T10 D18",65:"T19 D4",
  64:"T16 D8",63:"T17 D6",62:"T10 D16",61:"T15 D8",60:"S20 D20",
  59:"S19 D20",58:"S18 D20",57:"S17 D20",56:"T16 D4",55:"S15 D20",
  54:"S14 D20",53:"S13 D20",52:"T12 D8",51:"S11 D20",50:"Bull",
  49:"S9 D20",48:"S16 D16",47:"S15 D16",46:"S6 D20",45:"S5 D20",
  44:"S12 D16",43:"S3 D20",42:"S10 D16",41:"S9 D16",40:"D20",
  39:"S7 D16",38:"D19",37:"S5 D16",36:"D18",35:"S3 D16",
  34:"D17",33:"S1 D16",32:"D16",31:"S7 D12",30:"D15",
  28:"D14",26:"D13",24:"D12",22:"D11",20:"D10",
  18:"D9",16:"D8",14:"D7",12:"D6",10:"D5",
  8:"D4",6:"D3",4:"D2",2:"D1"
};
const IMPOSSIBLE=[169,168,166,165,163,162,159];
const NEIGHBOURS={1:[18,4],2:[15,17],3:[17,19],4:[18,13],5:[20,12],6:[10,13],7:[16,19],8:[11,16],9:[12,14],10:[15,6],11:[8,14],12:[5,9],13:[4,6],14:[9,11],15:[2,10],16:[7,8],17:[2,3],18:[1,4],19:[3,7],20:[1,5]};

// ─── BOT LEVELS ───────────────────────────────────────────────────────────────
const BOT_LEVELS={
  rookie:{name:"Rookie Bot",emoji:"🤖",desc:"Lekker casual",triple:3,single:45,miss:52,double:6,bull:2},
  casual:{name:"Casual Bot",emoji:"🎮",desc:"Avondje darten",triple:9,single:55,miss:36,double:12,bull:4},
  league:{name:"League Bot",emoji:"🏆",desc:"Competitieniveau",triple:24,single:61,miss:15,double:28,bull:10},
  pro:{name:"Pro Bot",emoji:"⚡",desc:"Bijna onverslaanbaar",triple:36,single:54,miss:10,double:40,bull:15},
};

// ─── BOT LOGIC ────────────────────────────────────────────────────────────────
function botChooseTarget(score, dartsLeft){
  if(score<=170 && CHECKOUTS[score]){
    const parts=CHECKOUTS[score].split(' ');
    // parse first needed dart based on darts thrown so far
    const dartIdx = 3 - dartsLeft;
    const part = parts[Math.min(dartIdx, parts.length-1)];
    return parseTarget(part);
  }
  // default: aim for T20
  return {type:'triple',number:20,value:60};
}

function parseTarget(str){
  if(str==='Bull') return {type:'bull',number:25,value:50};
  const m=str.match(/([TDS])(\d+)/);
  if(!m) return {type:'single',number:20,value:20};
  const n=parseInt(m[2]);
  if(m[1]==='T') return {type:'triple',number:n,value:n*3};
  if(m[1]==='D') return {type:'double',number:n,value:n*2};
  return {type:'single',number:n,value:n};
}

function botThrowDart(level, target, score){
  const cfg=BOT_LEVELS[level];
  const r=Math.random()*100;

  if(target.type==='bull'){
    if(r<cfg.bull) return {scored:50,desc:'Bull 🎯',isDouble:true};
    if(r<cfg.bull+25) return {scored:25,desc:'Single bull',isDouble:false};
    // miss to nearby
    const nb=[20,3,6,11,14,9][Math.floor(Math.random()*6)];
    return {scored:nb,desc:`Miss → ${nb}`,isDouble:false};
  }

  if(target.type==='triple'){
    if(r<cfg.triple) return {scored:target.number*3,desc:`T${target.number} ✓`,isDouble:false};
    if(r<cfg.triple+cfg.single) return {scored:target.number,desc:`S${target.number}`,isDouble:false};
    const nb=NEIGHBOURS[target.number][Math.floor(Math.random()*2)];
    return {scored:nb,desc:`Miss → ${nb}`,isDouble:false};
  }

  if(target.type==='double'){
    if(r<cfg.double) return {scored:target.number*2,desc:`D${target.number} ✓`,isDouble:true};
    // miss double: single or outside
    if(r<cfg.double+40) return {scored:target.number,desc:`S${target.number} (mis D)`,isDouble:false};
    return {scored:0,desc:`Buiten (mis D)`,isDouble:false};
  }

  return {scored:target.number,desc:`S${target.number}`,isDouble:false};
}

function botPlayTurn(level, startScore){
  let score=startScore;
  const darts=[];
  for(let d=3;d>=1;d--){
    if(score<=1){darts.push({scored:0,desc:'Geen worp nodig',bust:false,win:false});continue;}
    const target=botChooseTarget(score, d);
    let throw_=botThrowDart(level, target, score);
    const newScore=score-throw_.scored;
    if(newScore<0||newScore===1){
      darts.push({scored:0,desc:`Bust! (${throw_.desc})`,bust:true,win:false,targetDesc:describeTarget(target)});
      score=startScore; // bust resets for this turn tracking
      break;
    }
    if(newScore===0){
      if(throw_.isDouble||score===50){
        darts.push({scored:throw_.scored,desc:throw_.desc,bust:false,win:true,targetDesc:describeTarget(target)});
        score=0; break;
      } else {
        // not a double finish - treat as bust
        darts.push({scored:0,desc:`Bust! (geen dubbel: ${throw_.desc})`,bust:true,win:false,targetDesc:describeTarget(target)});
        break;
      }
    }
    darts.push({scored:throw_.scored,desc:throw_.desc,bust:false,win:false,targetDesc:describeTarget(target)});
    score=newScore;
  }
  return {darts, finalScore:score};
}

function describeTarget(t){
  if(t.type==='bull') return 'Bull';
  if(t.type==='triple') return `T${t.number}`;
  if(t.type==='double') return `D${t.number}`;
  return `S${t.number}`;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
const MODES=['501','301','121','killer'];
let state={
  screen:'setup', mode:'501', legs:3, numPlayers:1,
  opponent:'solo', // 'solo' | 'rookie' | 'casual' | 'league' | 'pro'
  players:[], currentPlayer:0, history:[], inputVal:'', winner:null,
  playerNames:['Jij','Speler 2','Speler 3','Speler 4'],
  killerScreen:'assign', killerPointsNeeded:5, killerSelectedTarget:null,
  // bot state
  botTurnResult:null, botTurnDone:false,
};

function startScore(){return state.mode==='121'?121:state.mode==='301'?301:501;}
function isBotMode(){return state.opponent!=='solo'&&state.opponent!=null&&['rookie','casual','league','pro'].includes(state.opponent);}
function isSolo(){return state.opponent==='solo'||state.numPlayers>1;}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function startGame(){
  const names=[];
  for(let i=0;i<state.numPlayers;i++){
    const el=document.getElementById('pname_'+i);
    names.push(el?el.value.trim()||('Speler '+(i+1)):state.playerNames[i]);
  }
  state.playerNames=[...names];

  if(state.mode==='killer'){
    let ps=names.slice(0,state.numPlayers).map(n=>mkKillerPlayer(n,false));
    if(isBotMode()&&state.numPlayers===1){
      ps.push(mkKillerPlayer(BOT_LEVELS[state.opponent].name+'  '+BOT_LEVELS[state.opponent].emoji,true));
    }
    state.players=ps;
    state.killerScreen='assign'; state.currentPlayer=0;
    state.history=[]; state.winner=null; state.screen='killer'; render(); return;
  }

  let ps=names.slice(0,state.numPlayers).map(n=>mkPlayer(n,false));
  if(isBotMode()&&state.numPlayers===1){
    ps.push(mkPlayer(BOT_LEVELS[state.opponent].name+' '+BOT_LEVELS[state.opponent].emoji,true));
  }
  state.players=ps;
  state.currentPlayer=0; state.history=[]; state.winner=null; state.inputVal='';
  state.botTurnResult=null; state.botTurnDone=false;
  state.screen='game'; render();
  if(state.players[0]&&state.players[0].isBot){
    setTimeout(()=>{playBotTurn();},600);
  }
}

function mkPlayer(name,isBot){return {name,isBot,score:startScore(),legs:0,throws:0,totalScore:0,busts:0,highScore:0};}
function mkKillerPlayer(name,isBot){return {name,isBot,number:null,points:0,lives:state.killerPointsNeeded,isKiller:false,eliminated:false,throws:0,totalScore:0,busts:0};}

function newGame(){clearBotTimer();state.screen='setup';state.botTurnResult=null;render();}

function applyScore(pts){
  const p=state.players[state.currentPlayer];
  const newScore=p.score-pts;
  if(newScore<0||newScore===1){
    p.busts++;
    state.history.push({player:p.name,threw:pts,result:'Bust!',prevScore:p.score,isBot:p.isBot});
    nextPlayer(); return;
  }
  if(newScore===0){
    p.throws++;p.totalScore+=pts;p.legs++;
    if(pts>p.highScore)p.highScore=pts;
    state.history.push({player:p.name,threw:pts,result:0,prevScore:p.score,isBot:p.isBot});
    const needed=Math.ceil(state.legs/2);
    if(p.legs>=needed){state.winner=p.name;state.screen='winner';render();return;}
    state.players.forEach(pl=>pl.score=startScore());
    nextPlayer(); return;
  }
  p.throws++;p.totalScore+=pts;
  if(pts>p.highScore)p.highScore=pts;
  state.history.push({player:p.name,threw:pts,result:newScore,prevScore:p.score,isBot:p.isBot});
  p.score=newScore; nextPlayer();
}

function nextPlayer(){
  clearBotTimer();
  state.currentPlayer=(state.currentPlayer+1)%state.players.length;
  state.inputVal='';
  state.botTurnResult=null; state.botTurnDone=false;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  if(state.players[state.currentPlayer]&&state.players[state.currentPlayer].isBot){
    botTimer=setTimeout(()=>{botTimer=null;playBotTurn();},600);
  }
}

function undo(){
  if(!state.history.length)return;
  const last=state.history.pop();
  const p=state.players.find(p=>p.name===last.player);
  p.score=last.prevScore;
  if(last.result!=='Bust!'){p.throws=Math.max(0,p.throws-1);p.totalScore=Math.max(0,p.totalScore-last.threw);}
  else p.busts=Math.max(0,p.busts-1);
  state.currentPlayer=state.players.indexOf(p);
  state.inputVal=''; state.botTurnResult=null; state.botTurnDone=false;
  render();
}

function numpad(val){
  if(val==='C'){state.inputVal='';}
  else{if(state.inputVal.length<3)state.inputVal+=val;}
  const inp=document.getElementById('scoreInput');
  if(inp)inp.value=state.inputVal;
}

function throwScore(){
  const val=parseInt(state.inputVal);
  if(isNaN(val)||val<0||val>180)return;
  applyScore(val);
}

function avg(p){if(!p.throws)return'—';return(p.totalScore/p.throws*3).toFixed(1);}

// ─── BOT TURN ─────────────────────────────────────────────────────────────────
let botTimer=null;
function clearBotTimer(){if(botTimer){clearTimeout(botTimer);botTimer=null;}}

function playBotTurn(){
  clearBotTimer();
  const p=state.players[state.currentPlayer];
  const result=botPlayTurn(state.opponent, p.score);
  state.botTurnResult=result;
  render();
  botTimer=setTimeout(()=>{
    botTimer=null;
    if(state.botTurnResult)confirmBotTurn();
  },2500);
}

function confirmBotTurn(){
  clearBotTimer();
  const p=state.players[state.currentPlayer];
  const result=state.botTurnResult;
  if(!result)return;
  const lastDart=result.darts[result.darts.length-1];
  if(lastDart&&lastDart.win){
    // bot wins leg
    p.legs++;p.throws+=result.darts.length;
    result.darts.forEach(d=>{if(!d.bust&&!d.win)p.totalScore+=d.scored;});
    p.totalScore+=lastDart.scored;
    state.history.push({player:p.name,threw:'beurt',result:0,prevScore:p.score,isBot:true});
    const needed=Math.ceil(state.legs/2);
    if(p.legs>=needed){state.winner=p.name;state.screen='winner';state.botTurnResult=null;render();return;}
    state.players.forEach(pl=>pl.score=startScore());
    state.botTurnResult=null; nextPlayer(); return;
  }
  // bust or normal
  const hasBust=lastDart&&lastDart.bust;
  if(hasBust){
    p.busts++;
    state.history.push({player:p.name,threw:'beurt',result:'Bust!',prevScore:p.score,isBot:true});
  } else {
    const total=result.darts.reduce((s,d)=>s+d.scored,0);
    p.throws+=result.darts.length; p.totalScore+=total;
    const newScore=p.score-total;
    p.score=newScore;
    state.history.push({player:p.name,threw:total,result:newScore,prevScore:p.score+total,isBot:true});
  }
  state.botTurnResult=null; nextPlayer();
}

// ─── KILLER LOGIC ─────────────────────────────────────────────────────────────
function killerAssignNumber(idx){
  const val=parseInt(document.getElementById('kassign_'+idx).value);
  if(isNaN(val)||val<1||val>20){alert('Kies een getal tussen 1 en 20');return;}
  if(state.players.some((p,i)=>i!==idx&&p.number===val)){alert('Dit nummer is al vergeven!');return;}
  state.players[idx].number=val; render();
}
function killerStartGame(){
  if(state.players.some(p=>p.number===null)){alert('Wijs iedereen een nummer toe!');return;}
  state.killerScreen='game'; state.currentPlayer=0; state.killerSelectedTarget=null; render();
}
function killerThrow(pts,mult){
  const p=state.players[state.currentPlayer];
  if(p.eliminated){nextKillerPlayer();return;}
  if(!p.isKiller){
    p.points=Math.min(state.killerPointsNeeded,p.points+pts);
    state.history.push({player:p.name,action:`+${pts} op ${p.number}`,result:p.points>=state.killerPointsNeeded?'KILLER!':'nog '+(state.killerPointsNeeded-p.points)+' nodig'});
    if(p.points>=state.killerPointsNeeded){p.isKiller=true;p.lives=state.killerPointsNeeded;}
    nextKillerPlayer();
  } else {
    if(state.killerSelectedTarget===null){alert('Selecteer eerst een doelwit!');return;}
    const target=state.players[state.killerSelectedTarget];
    target.lives=Math.max(0,target.lives-pts);
    state.history.push({player:p.name,action:`${mult} op nr ${target.number} (${target.name})`,result:`${target.name}: ${target.lives} levens over`});
    if(target.lives<=0){target.eliminated=true;target.isKiller=false;state.history.push({player:target.name,action:'UITGESCHAKELD',result:''});}
    state.killerSelectedTarget=null;
    const alive=state.players.filter(p=>!p.eliminated);
    if(alive.length===1){state.winner=alive[0].name;state.screen='winner';render();return;}
    nextKillerPlayer();
  }
}
function killerMiss(){state.history.push({player:state.players[state.currentPlayer].name,action:'Mis',result:''});nextKillerPlayer();}
function killerSelectTarget(idx){if(state.players[idx].eliminated||idx===state.currentPlayer)return;state.killerSelectedTarget=idx;render();}
function nextKillerPlayer(){let next=(state.currentPlayer+1)%state.players.length,tries=0;while(state.players[next].eliminated&&tries<state.players.length){next=(next+1)%state.players.length;tries++;}state.currentPlayer=next;state.killerSelectedTarget=null;render();}

function setMode(m){state.mode=m;render();}
function setOpponent(o){
  state.opponent=o;
  if(o!=='solo') state.numPlayers=1;
  render();
}

function removePlayer(i){
  state.playerNames.splice(i,1);
  state.numPlayers=Math.max(1,state.numPlayers-1);
  render();
}

function getTip(s,m){

  if(s>20)return'Focus op de dubbel. Diep ademhalen, rustig gooien.';
  return'Je kunt nu finishen! Stay calm — de dubbel is alles.';
}

    </div>
    <div class="killer-setup-box">${rows}</div>
    ${allAssigned?`<button class="start-btn" onclick="killerStartGame()">Start Killer! ⚔️</button>`:''}
    <button class="new-game-btn" onclick="newGame()">← Terug</button>`;
}
function renderKillerGame(){
  const p=state.players[state.currentPlayer];
  const isKiller=p.isKiller;
  const needed=Math.ceil(state.legs/2);
  const phaseBanner=isKiller
    ?`<div class="phase-banner phase-attack">⚔️ Killer — Selecteer doelwit en raak zijn/haar nummer!</div>`
    :`<div class="phase-banner phase-fill">🎯 Vulfase — Raak nummer ${p.number} (${p.points}/${state.killerPointsNeeded} punten)</div>`;
  const playersHtml=state.players.map((pl,i)=>{
    const lives=Array.from({length:state.killerPointsNeeded},(_,d)=>`<span class="life ${d>=pl.lives?'lost':''}"></span>`).join('');
    const fillDots=!pl.isKiller&&!pl.eliminated?Array.from({length:state.killerPointsNeeded},(_,d)=>`<div class="dot ${d<pl.points?'filled':''}"></div>`).join(''):'';
    const badge=pl.eliminated?`<span class="badge badge-gray">Uit</span>`:pl.isKiller?`<span class="badge badge-red">⚔️ Killer</span>`:i===state.currentPlayer?`<span class="badge badge-green">Beurt</span>`:'';
    return `<div class="player-card ${i===state.currentPlayer&&!pl.eliminated?'active':''} ${pl.isKiller&&!pl.eliminated?'killer-status':''} ${pl.eliminated?'eliminated':''}">
      <div class="player-top">
        <div>
          <div class="player-name">${pl.name} <span style="font-size:10px;color:var(--text3)">nr ${pl.number}</span></div>
          <div style="margin-top:6px;display:flex;gap:3px;align-items:center">${pl.isKiller||pl.eliminated?lives:fillDots}</div>
        </div>
        <div>${badge}</div>
      </div>
    </div>`;
  }).join('');
  let actionArea='';
  if(isKiller){
    const targets=state.players.map((pl,i)=>{
      if(pl.eliminated||i===state.currentPlayer)return'';
      return `<button class="target-btn ${state.killerSelectedTarget===i?'selected':''}" onclick="killerSelectTarget(${i})">
        <span class="t-name">${pl.name} — nr ${pl.number}</span>
        <span class="t-lives">${pl.lives}/${state.killerPointsNeeded} ❤️</span>
      </button>`;
    }).join('');
    const score_btns=state.killerSelectedTarget!==null?`
      <div class="section-title">Wat heb je geraakt?</div>
      <div class="killer-score-btns">
        <button class="kscore-btn ks" onclick="killerThrow(1,'Single')">Single<br><small style="font-size:10px;color:var(--text3);font-family:Inter,sans-serif;font-weight:400">-1 leven</small></button>
        <button class="kscore-btn kd" onclick="killerThrow(2,'Double')">Double<br><small style="font-size:10px;color:var(--green);font-family:Inter,sans-serif;font-weight:400">-2 levens</small></button>
        <button class="kscore-btn kt" onclick="killerThrow(3,'Triple')">Triple<br><small style="font-size:10px;color:var(--green);font-family:Inter,sans-serif;font-weight:400">-3 levens</small></button>
        <button class="kscore-btn kmiss" onclick="killerMiss()" style="grid-column:span 3">Mis / verkeerd getal</button>
      </div>`:`<button class="kscore-btn kmiss" onclick="killerMiss()" style="width:100%;margin-top:0.75rem">Mis / geen getal geraakt</button>`;
    actionArea=`<div class="section-title" style="margin-top:0">Kies doelwit:</div><div class="target-select">${targets}</div>${score_btns}`;
  } else {
    actionArea=`<div class="section-title" style="margin-top:0">Wat raakte je op nummer ${p.number}?</div>
      <div class="killer-score-btns">
        <button class="kscore-btn ks" onclick="killerThrow(1,'Single')">Single<br><small style="font-size:10px;color:var(--text3);font-family:Inter,sans-serif;font-weight:400">+1 punt</small></button>
        <button class="kscore-btn kd" onclick="killerThrow(2,'Double')">Double<br><small style="font-size:10px;color:var(--green);font-family:Inter,sans-serif;font-weight:400">+2 punten</small></button>
        <button class="kscore-btn kt" onclick="killerThrow(3,'Triple')">Triple<br><small style="font-size:10px;color:var(--green);font-family:Inter,sans-serif;font-weight:400">+3 punten</small></button>
        <button class="kscore-btn kmiss" onclick="killerMiss()" style="grid-column:span 3">Mis / verkeerd getal</button>
      </div>`;
  }
  const histItems=state.history.slice(-5).reverse().map(h=>`
    <div class="history-item"><span class="h-player">${h.player}</span><span>${h.action}${h.result?' — '+h.result:''}</span></div>`).join('')||`<div style="font-size:12px;color:var(--text3)">Nog geen worpen</div>`;
  return `${phaseBanner}
    <div class="players-grid" style="grid-template-columns:${state.players.length<=2?'1fr 1fr':state.players.length<=4?'1fr 1fr':'repeat(3,1fr)'}">${playersHtml}</div>
    <div class="card"><div class="card-label">Actie</div>${actionArea}</div>
    <div class="history-box"><div class="card-label">Recente acties</div>${histItems}</div>
    <button class="new-game-btn" onclick="newGame()">← Nieuw spel</button>`;
}

// ─── WINNER ───────────────────────────────────────────────────────────────────
function renderWinner(){
  const isKiller=state.mode==='killer';
  const needed=Math.ceil(state.legs/2);
  const cards=state.players.map(pl=>`
    <div class="player-card ${pl.name===state.winner?'active':''}">
      <div class="player-name">${pl.name} ${pl.name===state.winner?'🏆':''}</div>
      <div class="player-score" style="font-size:28px">${isKiller?(pl.eliminated?'Uitgeschakeld':'Winnaar!'):pl.legs+'/'+needed}</div>
      ${!isKiller?`<div class="player-stats-row"><div class="stat-chip">Avg: <b>${avg(pl)}</b></div><div class="stat-chip">Best: <b>${pl.highScore||'—'}</b></div><div class="stat-chip">Busts: <b>${pl.busts}</b></div></div>`:''}
    </div>`).join('');
  return `
    <div class="winner-banner"><h2>${state.winner} wint! 🎯</h2><p>Gefeliciteerd!</p></div>
    <div class="players-grid" style="grid-template-columns:${state.players.length<=2?'1fr 1fr':'repeat('+Math.min(state.players.length,3)+',1fr)'}">${cards}</div>
    <button class="new-game-btn" onclick="newGame()">← Nieuw spel</button>`;
}

render();


</script>
</body>
</html>
